<template>
  <div class="slds-grid slds-grid_align-center slds-grid_vertical-align-center">
    <template lwc:if={decidedOption}>
      <span class={decidedOption.textClass}>{decidedOption.label}</span>
    </template>
    <template for:each={availableOptions} for:item="option">
      <lightning-button-icon
        key={option.value}
        class={option.styleClass}
        icon-name="utility:record"
        variant="border-filled"
        size="small"
        title={option.label}
        alternative-text={option.label}
        data-value={option.value}
        onclick={handleOptionClick}
      ></lightning-button-icon>
    </template>
  </div>
</template>
