<template>
  <div class="language-switcher" role="group" aria-label={ariaLabel}>
    <template for:each={languageOptions} for:item="language">
      <span key={language.code} class="language-switcher__item">
        <button
          type="button"
          class={language.className}
          data-code={language.code}
          aria-current={language.ariaCurrent}
          disabled={isLoading}
          onclick={handleLanguageClick}
        >
          {language.label}
        </button>
      </span>
    </template>
  </div>
</template>
