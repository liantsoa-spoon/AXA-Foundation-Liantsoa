<template>
  <template lwc:if={isReadOnly}>
    <div
      class="notice slds-rich-text-editor__output slds-m-vertical_small"
      role="note"
    >
      <h3 class="notice-title">{labels.title}</h3>
      <p class="notice-message">{labels.message}</p>
    </div>
  </template>
</template>
