<template>
  <div class="slds-grid slds-grid_align-center slds-grid_vertical-align-center">
    <template for:each={displayedOptions} for:item="option">
      <button
        key={option.value}
        type="button"
        class={option.buttonClass}
        title={option.label}
        data-value={option.value}
        onclick={handleOptionClick}
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d={option.iconPath}></path>
        </svg>
        <span class="slds-assistive-text">{option.label}</span>
      </button>
    </template>
  </div>
</template>
